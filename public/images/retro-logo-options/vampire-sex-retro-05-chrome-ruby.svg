<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 980" role="img" aria-labelledby="title desc">
  <title id="title">Vampire Sex Retro Logo Option 05 Chrome Ruby</title>
  <desc id="desc">Transparent background retro 3D Vampire Sex wordmark in chrome silver, ruby, black cherry, amber, and petrol blue.</desc>
  <defs>
