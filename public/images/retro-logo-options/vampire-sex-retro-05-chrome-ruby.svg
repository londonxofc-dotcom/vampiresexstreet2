    <g transform="translate(56 96)" fill="#09131d"><text class="word" x="0" y="0">VAMPIRE</text><text class="word sex" x="86" y="245">SEX</text></g>
    <g transform="translate(42 76)" fill="#ffb000"><text class="word" x="0" y="0">VAMPIRE</text><text class="word sex" x="86" y="245">SEX</text></g>
    <g transform="translate(28 54)" fill="#d30032"><text class="word" x="0" y="0">VAMPIRE</text><text class="word sex" x="86" y="245">SEX</text></g>
    <g transform="translate(15 30)" fill="#8b0018"><text class="word" x="0" y="0">VAMPIRE</text><text class="word sex" x="86" y="245">SEX</text></g>
    <g transform="translate(6 12)" fill="#5d0014"><text class="word" x="0" y="0">VAMPIRE</text><text class="word sex" x="86" y="245">SEX</text></g>
    <g fill="url(#chrome)" stroke="#ffffff" stroke-width="14"><text class="word" x="0" y="0">VAMPIRE</text><text class="word sex" x="86" y="245">SEX</text></g>
    <g fill="none" stroke="#30343a" stroke-width="4" opacity=".62"><text class="word" x="0" y="0">VAMPIRE</text><text class="word sex" x="86" y="245">SEX</text></g>
